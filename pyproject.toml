[project]
name = "kairos"
version = "0.2.0"
description = "Kairos Memory System — AI agent 记忆系统（竖切 v0.1.0-slice）"
readme = "docs/README.md"
requires-python = ">=3.11"
# 许可证占位（正式许可证待 release-guide 定稿，当前以 Proprietary 占位保证构建元数据完整）
license = { text = "Proprietary" }
dependencies = [
    # CLI 框架（W1 定档：Typer——与 Litestar 类型安全理念一致，mypy 友好）
    "typer>=0.12",
    # Web 框架（REST API；<3 上限：3.0 移除 Body()/Parameter() 默认值写法，
    # 已按 2.x Annotated 新风格迁移（routes/extended），3.0 发布后再评估升级）
    "litestar>=2.0,<3",
    "uvicorn>=0.22",
    # 存储（轻量模式 SQLite；标准模式 PostgreSQL 竖切验收后适配，ADR-001）
    "sqlalchemy>=2.0",
    "aiosqlite",
    "alembic>=1.13",
    # 向量检索（轻量模式 sqlite-vec；嵌入维度 1536）
    "sqlite-vec>=0.1",
    "numpy>=1.26",
    # 密码学（审计 HMAC 链 / API Key 哈希，S-01/S-05/S-16）
    "cryptography>=42.0",
    # 周期性任务（空闲驱动调度，ADR-006）
    "apscheduler>=3.10",
    # MCP 协议（Bridge 独立子进程，api-spec §6.8；1.x 内置 FastMCP）
    "mcp>=1.0,<2",
    # PostgreSQL 后端（D-449：pgvector 适配，ADR-001）
    "asyncpg>=0.29",
    "httpx>=0.27",
]

[project.scripts]
kairos = "src.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "migrations", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "redline: 安全红线验证（S-01~S-19）",
    "falsification: 证伪测试（[FALSIFICATION] 套件）",
    "benchmark: 性能基准",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["N801"]  # 类名允许非首字母大写缩写

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# 目标 3.12：numpy 新版 stub 使用 3.12 type 语句语法，3.11 模式无法解析；
# 运行兼容性仍为 >=3.11（python_requires），mypy 仅检查语法目标
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["src"]
branch = true
# parallel=true：pytest-xdist 并行时各 worker 写独立 .coverage.* 数据文件，
# 主进程自动合并——否则并行模式覆盖率被低估（2026-08-13 第三轮审计 P1-1 修复）
parallel = true

[tool.coverage.report]
fail_under = 80
show_missing = true
